services:
  db:
    container_name: postgres_container
    image: postgres:14.17
    ports:
      - 5000:5432
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ../postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql

    networks:
      - my-network


  af:
    container_name: airflow_container
    image: apache/airflow:3.0.0
    ports:
      - 8000:8080
    env_file:
      - ../.env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
      PYTHONPATH: /opt/airflow/api-request
      DBT_PROFILES_DIR: /opt/airflow/dbt
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - .:/opt/airflow/api-request
      - ../dbt/my_project:/opt/airflow/dbt
    depends_on:
      - db
    networks:
      - my-network
    command: >
      bash -c "pip install dbt-postgres==1.9.0 && airflow db migrate && airflow standalone"

  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    volumes:
      - ../dbt/my_project:/usr/app
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
    depends_on:
      - db
    networks:
      - my-network
    entrypoint: [""]
    command: ["tail", "-f", "/dev/null"]

networks:
  my-network:
    driver: bridge